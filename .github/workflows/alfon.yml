name: Build Alfon
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          # לוקחים את קובץ Alfon*.zip שהועלה אחרון, מה שלא יהיה שמו המדויק
          ZIP=""; BEST=0
          for f in Alfon*.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$BEST" ]; then BEST=$t; ZIP="$f"; fi
          done
          echo "Using: $ZIP"
          rm -rf work && mkdir work && unzip -q "$ZIP" -d work
          cd work/Alfon
          # אנשי קשר מובנים: contacts.xlsx / contacts.csv משורש המאגר
          for c in contacts.xlsx contacts.csv; do
            if [ -f "$GITHUB_WORKSPACE/$c" ]; then cp "$GITHUB_WORKSPACE/$c" app/src/main/assets/www/; echo "Contacts: $c"; fi
          done
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=$((100 + ${{ github.run_number }}))
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/alfon.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete alfon --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create alfon alfon.apk --repo ${{ github.repository }} --title "Alfon ${{ github.run_number }}" --notes "Build ${{ github.run_number }}"
